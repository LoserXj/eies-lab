bio: I received my bachelor’s degree in Building Environment and Energy
  Application Engineering from Tianjin University in 2020. I ranked first in my
  major and was admitted to the university’s master’s program without an
  entrance exam. I began doctoral studies in 2022 and joint doctoral training at
  the Shenzhen Institutes of Advanced Technology, Chinese Academy of Sciences,
  in 2023. In 2026, I received my PhD in Building Environment and Energy
  Application Engineering from Tianjin University. My dissertation received the
  university’s Outstanding Doctoral Dissertation Award. Later that year, I began
  postdoctoral research at The Hong Kong Polytechnic University.
bio_zh: 2020年获天津大学建筑环境与能源应用工程专业学士学位，并以专业第一的成绩获推荐免试攻读硕士研究生资格。2022年转入博士阶段学习，2023年起在中国科学院深圳先进技术研究院接受联合培养。2026年获天津大学建筑环境与能源应用工程专业博士学位，博士学位论文获评天津大学优秀博士学位论文。同年起在香港理工大学从事博士后研究。
