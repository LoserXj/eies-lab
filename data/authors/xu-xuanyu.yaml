bio: Xuanyu Xu joined EIES-Lab as RA in September 2025.  His research focus on
  the intersection of GeoAI, traffic analysis and urban sensing, with a focus on
  spatiotemporal deep learning for vehicle rooftop solar potential estimation
  and road extraction. My objective is to leverage this high-resolution data to
  model urban mobility, identify traffic congestion patterns, and even evaluate
  the potential of transportation infrastructure for sustainable applications.
