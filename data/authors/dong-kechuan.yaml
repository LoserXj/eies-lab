  - id: 2025-global-facade-rooftop-pv-dataset
    title: Global facade & rooftop PV potential dataset
    title_zh: 全球建筑立面与屋顶光伏潜力数据集
    date: 2025-06-01
    tag: Dataset
    tag_zh: 数据集
    summary: Building-level facade and rooftop PV potential for 120 cities, from 3D footprints and meteorology.
    summary_zh: 基于三维建筑轮廓与气象数据，给出 120 座城市逐栋建筑的立面与屋顶光伏潜力。
    cover: media/members/dong-kechuan-bipv.jpg
    tags:
      - Dataset
      - Facade PV
      - Rooftop PV
    tags_zh:
      - 数据集
      - 立面光伏
      - 屋顶光伏
    sample: true
    body_zh: |-
      ## 数据内容

      对每座城市的每栋建筑，给出屋顶和各个立面的年度与逐时太阳辐照、扣除窗户和遮挡后的可用面积，以及由此得到的光伏发电潜力。

      ## 构建方法

      - 建筑轮廓与高度来自开放的三维城市模型。
      - 立面元素（窗户、墙面）从街景图像中解析得到。
      - 逐时辐照结合当地气象数据和周边建筑的遮挡计算。

      ## 研究用途

      可用于城市级建筑光伏规划、城市之间的比较，也可作为训练更快的学习模型的数据。
    body: |
      ## What it contains

      For every building in each city, the dataset gives annual and hourly solar irradiation on the roof and on each facade, the usable area after windows and obstructions are removed, and the resulting PV generation potential.

      ## How it is built

      - Building footprints and heights come from open 3D city models.
      - Facade elements (windows, walls) are parsed from street-view images.
      - Hourly irradiation uses local meteorology and the shading cast by neighbouring buildings.

      ## Research uses

      The dataset supports city-level planning of building-integrated PV, comparisons between cities, and training data for faster learned models.
  - id: 2025-shadow-aware-rooftop-pv-model
    title: Shadow-aware rooftop PV model
    title_zh: 考虑遮挡的屋顶光伏模型
    date: 2025-09-01
    tag: Model
    tag_zh: 模型
    summary: Spatiotemporal deep learning that predicts shading and rooftop PV potential about 158 times faster than simulation.
    summary_zh: 时空深度学习模型，预测遮挡与屋顶光伏潜力，速度约为模拟方法的 158 倍。
    cover: media/members/dong-kechuan-rooftop.jpg
    tags:
      - Model
      - Rooftop PV
      - Deep learning
    tags_zh:
      - 模型
      - 屋顶光伏
      - 深度学习
    sample: true
    body_zh: |-
      ## 模型结构

      模型输入周边建筑的高度图和太阳位置，预测一年中每个小时每个屋顶上的遮挡；时间分支再把逐时遮挡和天气转换为光伏出力。

      ## 为什么快

      光线追踪的遮挡计算需要对每个小时、每栋建筑重新计算。学习模型替代了这一步，使城市级计算比模拟快约 158 倍。

      ## 输入与输出

      - **输入：** 建筑高度、屋顶几何、太阳位置、逐时天气。
      - **输出：** 逐时遮挡掩膜和每栋建筑的屋顶光伏潜力。
    body: |
      ## Model structure

      The model takes a height map of the surrounding buildings and the sun position, and predicts the shading on each roof for every hour of the year. A temporal branch then turns hourly shading and weather into PV output.

      ## Why it is fast

      Ray-traced shading has to be recomputed for every hour and every building. The learned model replaces that step, which is what makes city-wide runs about 158 times faster than simulation.

      ## Inputs and outputs

      - **Inputs:** building heights, roof geometry, sun position, hourly weather.
      - **Outputs:** hourly shading masks and rooftop PV potential per building.
