bio: |
  Kechuan Dong joined EIES-Lab as a PhD student in September 2026. His research sits at the
  intersection of artificial intelligence, geospatial analysis and urban energy systems, with a
  focus on spatiotemporal deep learning for large-scale rooftop and facade solar potential
  estimation. He has also worked on 3D human pose estimation for prosthesis users through
  multi-source data fusion, and is interested in interpretable, physics-informed AI for
  real-world sustainability problems.
bio_zh: |
  2026 年 9 月加入 EIES-Lab 攻读博士学位。研究方向是人工智能、地理空间分析与城市能源系统的交叉，
  重点是面向大规模屋顶与立面太阳能潜力估算的时空深度学习。此前也从事过基于多源数据融合的
  假肢用户 3D 人体姿态估计研究，关注可解释、物理信息驱动的 AI 在真实可持续问题中的应用。
