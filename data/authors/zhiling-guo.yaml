bio: >
  Zhiling Guo is an Assistant Professor in the Department of Building
  Environment

  and Energy Engineering (BEEE) at The Hong Kong Polytechnic University.

  The research develops digital, intelligent, and efficient urban energy systems
  for sustainable and

  resilient cities, integrating machine learning, geoscience, IoT, and renewable
  energy.
